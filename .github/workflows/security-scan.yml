name: Security scan (reusable)

on:
  workflow_call:
    inputs:
      audit_dirs:
        description: >-
          Space-separated list of directories to run npm audit (audit-ci)
          against, each containing its own package.json/package-lock.json.
        type: string
        default: "."
      audit_allowlist:
        description: >-
          Space-separated list of GHSA IDs to allowlist in audit-ci (for
          advisories with no upstream fix available). Applied to every
          directory in audit_dirs.
        type: string
        default: ""
      semgrep_exclude:
        description: >-
          Space-separated list of additional --exclude patterns for the
          Semgrep scan (e.g. "terraform" when Terraform posture is covered
          by a separate tool like Prowler).
        type: string
        default: ""

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits to scope its scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm audit
        env:
          AUDIT_DIRS: ${{ inputs.audit_dirs }}
          AUDIT_ALLOWLIST: ${{ inputs.audit_allowlist }}
        run: |
          for dir in $AUDIT_DIRS; do
            echo "== $dir =="
            if [ -n "$AUDIT_ALLOWLIST" ]; then
              npx --yes audit-ci@7.1.0 --directory "$dir" --high --allowlist $AUDIT_ALLOWLIST
            else
              npx --yes audit-ci@7.1.0 --directory "$dir" --high
            fi
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Semgrep
        env:
          SEMGREP_EXCLUDE: ${{ inputs.semgrep_exclude }}
        run: |
          python3 -m pip install semgrep
          if [ -n "$SEMGREP_EXCLUDE" ]; then
            semgrep scan --config p/security-audit --config p/owasp-top-ten --error --exclude $SEMGREP_EXCLUDE .
          else
            semgrep scan --config p/security-audit --config p/owasp-top-ten --error .
          fi

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
